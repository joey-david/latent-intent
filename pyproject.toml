[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-intent-probes"
version = "0.1.0"
description = "Activation probing experiments for suppressed private objective signals in LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "tabulate>=0.9",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.44,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
latent-intent-probes = "latent_intent_probe.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
