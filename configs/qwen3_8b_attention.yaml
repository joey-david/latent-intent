run:
  name: temporal-latent-intent-qwen3-8b-attn
  seed: 20260607
  output_dir: results

model:
  name: Qwen/Qwen3-8B
  dtype: auto
  device_map: auto
  trust_remote_code: false
  batch_size: 1
  max_new_tokens: 80
  attn_implementation: eager
  collect_attentions: true
  enable_thinking: false

dataset:
  examples_per_label: 180
  include_neutral_decoys: true

probe:
  cv_folds: 5
  max_iter: 2000
  regularization_c: 0.25
  transfer_top_k_layers: 4

report:
  top_k_layers: 8
  top_k_heads: 20
